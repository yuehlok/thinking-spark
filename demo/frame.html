<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#faf9f5;display:flex;align-items:center;justify-content:center;height:100vh}</style></head><body>
<thinking-spark id="s" variant="orbit" size="120"></thinking-spark>
<script type="module">
import '../src/thinking-spark.js';
const q = new URLSearchParams(location.search);
const s = document.getElementById('s');
s.setAttribute('variant', q.get('v') || 'orbit');
s.setAttribute('size', q.get('size') || '120');
await new Promise(r => requestAnimationFrame(() => setTimeout(r, 50)));
const t = Number(q.get('t') || 0);
for (const a of s.shadowRoot.getAnimations()) { a.pause(); a.currentTime = t; }
document.title = 'ready';
</script></body></html>
